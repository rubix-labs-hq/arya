version: 2
updates:
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Preact 11 changes the distribution paths used by the editor and native bundle.
      # Keep compatible updates while that migration is not implemented.
      - dependency-name: preact
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
