<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Arya link preview</title>
<!--
  Source for site/assets/brand/link-preview.png, the 1200 by 630 image that link previews
  show (og:image and twitter:image).

  The panel is the Color inspector of the Mac app, Mac App Store build 1.1.0 (3), with the
  After the Tide sample project, from site/assets/product/native-mac-color-inspector.webp.
  It is scaled down to 55 percent and shown whole. Nothing is drawn over it.

  Rebuild from the repository root with any current Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --force-color-profile=srgb --allow-file-access-from-files \
      --virtual-time-budget=3000 --window-size=1200,630 \
      --screenshot=site/assets/brand/link-preview.png docs/design/link-preview.html

  Keep the headline in step with the brand line in arya-brand.md. Do not add a platform,
  price, sign-in or assistant claim here: link previews are cached for a long time.
-->
<style>
@font-face{font-family:"Manrope";src:url("../../site/assets/fonts/manrope.ttf") format("truetype");font-weight:200 800;font-style:normal}
@font-face{font-family:"Newsreader";src:url("../../site/assets/fonts/newsreader-italic.ttf") format("truetype");font-weight:200 800;font-style:italic}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#151615}
.card{position:relative;overflow:hidden;width:1200px;height:630px;background:#151615;color:#f2f0e9;font-family:"Manrope",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;font-kerning:normal}
.mark{position:absolute;left:59.8px;top:50px;height:46px;width:auto}
h1{position:absolute;left:64px;top:232px;font-family:"Newsreader",serif;font-style:italic;font-weight:500;font-size:116px;line-height:1;letter-spacing:-.022em;white-space:nowrap}
h1 span{display:block}
p{position:absolute;left:64px;top:486px;width:480px;font-size:30px;font-weight:500;line-height:1.3;letter-spacing:-.012em;color:#b5b8ae;text-wrap:balance}
/* 440 / 802 = 0.5486. The plate shows all 904 rows of the panel. */
.plate{position:absolute;left:696px;top:82px;width:440px;height:496px;overflow:hidden;border-radius:8px;background:#000;box-shadow:0 0 0 1px #44473f,0 30px 80px rgba(0,0,0,.55)}
.plate img{display:block;width:440px;height:auto}
.tick{position:absolute;width:24px;height:24px;border:0 solid #efbc68}
.tl{left:683px;top:69px;border-top-width:3px;border-left-width:3px}
.tr{left:1125px;top:69px;border-top-width:3px;border-right-width:3px}
.bl{left:683px;top:567px;border-bottom-width:3px;border-left-width:3px}
.br{left:1125px;top:567px;border-bottom-width:3px;border-right-width:3px}
</style>
<body>
<main class="card">
  <div class="plate"><img src="../../site/assets/product/native-mac-color-inspector.webp" alt=""></div>
  <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
  <img class="mark" src="../../site/assets/brand/wordmark.svg" alt="Arya">
  <h1><span>Your edit.</span><span>Every layer.</span></h1>
  <p>Editing, motion, color and delivery in one project.</p>
</main>
</body>
</html>
